name: Game Day — CPU and Memory Pressure

on:
  workflow_dispatch:
    inputs:
      cpu_load_percent:
        description: 'CPU load percentage to simulate (0-100)'
        required: true
        default: '85'
      memory_percent:
        description: 'Memory percentage to consume (0-100)'
        required: true
        default: '85'
      duration_seconds:
        description: 'How long to hold the pressure (seconds)'
        required: true
        default: '600'

jobs:
  cpu-memory-pressure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.APP_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Record pressure start
        run: |
          START=$(date +%s)
          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_cpu_pressure_start_timestamp $START
          gameday_cpu_pressure_percent{scenario="cpu_memory"} ${{ github.event.inputs.cpu_load_percent }}
          gameday_memory_pressure_percent{scenario="cpu_memory"} ${{ github.event.inputs.memory_percent }}
          EOF
          echo "CPU/Memory pressure start recorded to Pushgateway"

      - name: Install stress-ng on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "which stress-ng || sudo apt-get install -y stress-ng"
          echo "stress-ng ready on server"

      - name: Get server CPU count
        id: cpu_count
        run: |
          CPUS=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.APP_SERVER_IP }} \
            "nproc")
          echo "cpus=${CPUS}" >> $GITHUB_OUTPUT
          echo "Server has ${CPUS} CPU(s)"

      - name: Get server total memory
        id: memory_info
        run: |
          TOTAL_MB=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "free -m | awk '/^Mem:/{print \$2}'")
          TARGET_MB=$(( TOTAL_MB * ${{ github.event.inputs.memory_percent }} / 100 ))
          echo "total_mb=${TOTAL_MB}" >> $GITHUB_OUTPUT
          echo "target_mb=${TARGET_MB}" >> $GITHUB_OUTPUT
          echo "Total memory: ${TOTAL_MB}MB — Target: ${TARGET_MB}MB"

      - name: Apply CPU and memory pressure
        run: |
          CPUS="${{ steps.cpu_count.outputs.cpus }}"
          TARGET_MB="${{ steps.memory_info.outputs.target_mb }}"
          DURATION="${{ github.event.inputs.duration_seconds }}"
          echo "Applying pressure for ${DURATION}s"
          echo "  CPU workers : ${CPUS}"
          echo "  Memory target: ${TARGET_MB}MB"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "nohup sudo stress-ng \
              --cpu ${CPUS} \
              --cpu-load ${{ github.event.inputs.cpu_load_percent }} \
              --vm 1 \
              --vm-bytes ${TARGET_MB}M \
              --timeout ${DURATION}s \
              --metrics-brief \
              > /tmp/stress-ng.log 2>&1 &
             echo \$! > /tmp/stress-ng.pid
             echo 'stress-ng started with PID '\$(cat /tmp/stress-ng.pid)"
          echo "Pressure applied — watch Grafana Node Exporter dashboard"

      - name: Watch for warning alert (wait 5 minutes)
        run: |
          echo "Waiting 5 minutes for WARNING alert to fire..."
          echo "Expected: CpuHighWarning (CPU > 80% for 5 mins)"
          echo "Expected: MemoryHighWarning (Memory > 80% for 5 mins)"
          echo ""
          echo "Watch Node Exporter dashboard:"
          echo "  http://${{ secrets.MONITORING_SERVER_IP }}:3000/d/node-exporter-001"
          echo ""
          echo "Watch Slack #DevOps-Alerts for WARNING notification"
          sleep 300
          echo "Screenshot now: WARNING alert should be in Slack"

      - name: Capture metrics at warning threshold
        run: |
          CPU=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "top -bn1 | grep 'Cpu(s)' | awk '{print \$2}' | cut -d'%' -f1 || echo 'no_data'")
          MEM=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.APP_SERVER_IP }} \
            "free | awk '/^Mem:/{printf \"%.1f\", \$3/\$2*100}' || echo 'no_data'")
          echo "Current CPU usage : ${CPU}%"
          echo "Current Memory usage: ${MEM}%"
          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_cpu_actual_percent{scenario="cpu_memory",phase="warning"} ${CPU}
          gameday_memory_actual_percent{scenario="cpu_memory",phase="warning"} ${MEM}
          EOF

      - name: Watch for critical alert (wait additional 5 minutes)
        run: |
          echo "Waiting additional 5 minutes for CRITICAL alert to fire..."
          echo "Expected: CpuHighCritical (CPU > 90% for 10 mins)"
          echo "Expected: MemoryHighCritical (Memory > 90% for 5 mins)"
          echo ""
          echo "Watch Slack #DevOps-Alerts for CRITICAL notification"
          sleep 300
          echo "Screenshot now: CRITICAL alert should be in Slack"

      - name: Capture metrics at critical threshold
        run: |
          CPU=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess@${{ secrets.APP_SERVER_IP }} \
            "top -bn1 | grep 'Cpu(s)' | awk '{print \$2}' | cut -d'%' -f1 || echo 'no_data'")
          MEM=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess@${{ secrets.APP_SERVER_IP }} \
            "free | awk '/^Mem:/{printf \"%.1f\", \$3/\$2*100}' || echo 'no_data'")
          echo "Current CPU usage : ${CPU}%"
          echo "Current Memory usage: ${MEM}%"
          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_cpu_actual_percent{scenario="cpu_memory",phase="critical"} ${CPU}
          gameday_memory_actual_percent{scenario="cpu_memory",phase="critical"} ${MEM}
          EOF

      - name: Stop pressure and allow recovery
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess@${{ secrets.APP_SERVER_IP }} \
            "if [ -f /tmp/stress-ng.pid ]; then \
               sudo kill \$(cat /tmp/stress-ng.pid) 2>/dev/null || true; \
               sudo pkill -f stress-ng 2>/dev/null || true; \
               rm -f /tmp/stress-ng.pid; \
               echo 'stress-ng stopped'; \
             else \
               sudo pkill -f stress-ng 2>/dev/null || true; \
               echo 'stress-ng killed by pid search'; \
             fi"
          echo "Pressure removed — waiting for recovery alerts"

      - name: Wait for recovery alerts
        if: always()
        run: |
          echo "Waiting 2 minutes for RESOLVED alerts to fire in Slack..."
          sleep 120
          echo "Screenshot now: RESOLVED alerts should be in Slack"
          echo "Check Node Exporter dashboard — metrics should be back to normal"

      - name: Record pressure end
        if: always()
        run: |
          END=$(date +%s)
          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_cpu_pressure_end_timestamp $END
          gameday_cpu_pressure_complete{scenario="cpu_memory",status="done"} 1
          EOF
          echo "CPU/Memory pressure end recorded to Pushgateway"

      - name: Scenario 3 summary
        if: always()
        run: |
          echo "============================================"
          echo "GAME DAY SCENARIO 3 — CPU/MEMORY PRESSURE"
          echo "============================================"
          echo "CPU load target  : ${{ github.event.inputs.cpu_load_percent }}%"
          echo "Memory target    : ${{ github.event.inputs.memory_percent }}%"
          echo "Duration         : ${{ github.event.inputs.duration_seconds }}s"
          echo ""
          echo "Alert sequence expected:"
          echo "  1. CpuHighWarning  fires after 5 mins  (CPU > 80%)"
          echo "  2. CpuHighCritical fires after 10 mins (CPU > 90%)"
          echo "  3. MemoryHighWarning  fires after 5 mins  (Memory > 80%)"
          echo "  4. MemoryHighCritical fires after 5 mins  (Memory > 90%)"
          echo "  5. All RESOLVED after stress-ng stops"
          echo ""
          echo "Screenshots to take:"
          echo "  1. Terminal — stress-ng running"
          echo "  2. Node Exporter dashboard — CPU spike"
          echo "  3. Node Exporter dashboard — Memory spike"
          echo "  4. Slack — WARNING alert firing"
          echo "  5. Slack — CRITICAL alert firing"
          echo "  6. Slack — RESOLVED alert after recovery"
          echo "  7. Node Exporter dashboard — back to normal"
          echo "============================================"