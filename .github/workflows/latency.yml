name: Game Day — Latency Injection

on:
  workflow_dispatch:
    inputs:
      latency_ms:
        description: 'Latency to inject in milliseconds'
        required: true
        default: '600'
      duration_seconds:
        description: 'How long to hold the latency (seconds)'
        required: true
        default: '300'

jobs:
  inject-latency:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.APP_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Record latency injection start
        run: |
          START=$(date +%s)

          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_latency_injection_start_timestamp ${START}
          gameday_latency_injection_ms{scenario="latency"} ${{ github.event.inputs.latency_ms }}
          EOF

          echo "Latency injection start recorded"

      - name: Detect network interface on server
        id: detect_iface
        run: |
          IFACE=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "ip -o link show | awk -F': ' '\$2 != \"lo\" {print \$2; exit}'")

          echo "iface=${IFACE}" >> $GITHUB_OUTPUT
          echo "Detected interface: ${IFACE}"

      - name: Inject latency on server
        run: |
          IFACE="${{ steps.detect_iface.outputs.iface }}"

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "sudo tc qdisc add dev ${IFACE} root netem delay ${{ github.event.inputs.latency_ms }}ms 2>/dev/null \
             || sudo tc qdisc change dev ${IFACE} root netem delay ${{ github.event.inputs.latency_ms }}ms"

          echo "Injected latency"

      - name: Generate traffic
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "nohup bash -c '
              for i in \$(seq 1 100); do
                curl -s https://open-profile.hng14.com/ > /dev/null 2>&1;
                curl -s http://api.open-profile.hng14.com/ > /dev/null 2>&1;
                sleep 3;
              done
            ' > /tmp/traffic.log 2>&1 &"

      - name: Hold latency
        run: |
          echo "Holding latency for ${{ github.event.inputs.duration_seconds }}s"
          sleep ${{ github.event.inputs.duration_seconds }}

      - name: Capture SLI (P95)
        run: |
          P95=$(ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "curl -s 'http://localhost:9090/api/v1/query?query=probe_duration_seconds' \
            | python3 -c '
import json,sys
d=json.load(sys.stdin)
r=d.get(\"data\",{}).get(\"result\",[])
print(r[0][\"value\"][1] if r else 0)
'")

          echo "P95 latency: ${P95}s"

          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_latency_p95_seconds{scenario="latency"} ${P95}
          EOF

      - name: Remove latency and cleanup
        if: always()
        run: |
          IFACE="${{ steps.detect_iface.outputs.iface }}"

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            techgoddess-op@${{ secrets.APP_SERVER_IP }} \
            "sudo tc qdisc del dev ${IFACE} root 2>/dev/null || true;
             pkill -f curl || true;
             echo 'cleanup complete'"

      - name: Record end
        if: always()
        run: |
          END=$(date +%s)

          cat <<EOF | curl -s --data-binary @- \
            http://${{ secrets.PUSHGATEWAY_URL }}/metrics/job/github_actions/instance/gameday
          gameday_latency_injection_end_timestamp ${END}
          gameday_latency_injection_complete{scenario="latency",status="done"} 1
          EOF

      - name: Summary
        if: always()
        run: |
          echo "===================================="
          echo "GAME DAY — LATENCY INJECTION"
          echo "Latency: ${{ github.event.inputs.latency_ms }}ms"
          echo "Duration: ${{ github.event.inputs.duration_seconds }}s"
          echo "SLO: 500ms"
          echo "===================================="